<!DOCTYPE html>
<html>
<head>
    <title>IM Chat Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
        .panel { border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .message { padding: 8px; margin: 5px 0; border-radius: 3px; }
        .sent { background: #e3f2fd; text-align: right; }
        .received { background: #f5f5f5; text-align: left; }
        input, button { padding: 8px; margin: 5px; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <h1>即时通讯(IM)测试</h1>
    
    <div class="panel">
        <h3>1. 身份验证</h3>
        <input type="text" id="username" placeholder="用户名" value="zhangsan">
        <input type="password" id="password" placeholder="密码" value="123456">
        <button onclick="login()">登录获取Token</button>
        <div id="tokenDisplay"></div>
    </div>
    
    <div class="panel">
        <h3>2. WebSocket连接</h3>
        <button onclick="connect()">连接WebSocket</button>
        <button onclick="disconnect()">断开连接</button>
        <div id="status">状态: 未连接</div>
    </div>
    
    <div class="panel">
        <h3>3. 发送消息</h3>
        <input type="number" id="receiverId" placeholder="接收者ID" value="2">
        <input type="text" id="messageContent" placeholder="消息内容" size="40">
        <button onclick="sendMessage()">发送</button>
    </div>
    
    <div class="panel">
        <h3>4. 消息列表</h3>
        <div id="messages"></div>
    </div>
    
    <script>
        let stompClient = null;
        let token = null;
        let currentUserId = null;
        
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:8090/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    token = data.data.token;
                    currentUserId = data.data.userId;
                    document.getElementById('tokenDisplay').innerHTML = 
                        '<span style="color:green">Token获取成功!</span><br>UserId: ' + currentUserId;
                    addMessage('系统', '登录成功，UserId: ' + currentUserId);
                } else {
                    document.getElementById('tokenDisplay').innerHTML = 
                        '<span style="color:red">登录失败: ' + data.message + '</span>';
                }
            } catch (e) {
                document.getElementById('tokenDisplay').innerHTML = 
                    '<span style="color:red">请求失败: ' + e + '</span>';
            }
        }
        
        function connect() {
            if (!token) {
                alert('请先登录获取Token');
                return;
            }
            
            const socket = new SockJS('http://localhost:8090/ws?token=' + token);
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function(frame) {
                document.getElementById('status').innerHTML = 
                    '<span style="color:green">状态: 已连接 ✓</span>';
                addMessage('系统', 'WebSocket连接成功');
                
                // 订阅个人消息通道
                stompClient.subscribe('/user/queue/messages', function(message) {
                    const msg = JSON.parse(message.body);
                    addMessage(msg.senderName, msg.content, 'received');
                    console.log('Received:', msg);
                });
                
            }, function(error) {
                document.getElementById('status').innerHTML = 
                    '<span style="color:red">状态: 连接失败 ✗</span>';
                addMessage('系统', 'WebSocket连接失败: ' + error);
            });
        }
        
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            document.getElementById('status').innerHTML = '状态: 已断开';
            addMessage('系统', 'WebSocket已断开');
        }
        
        function sendMessage() {
            if (!stompClient || !stompClient.connected) {
                alert('请先连接WebSocket');
                return;
            }
            
            const receiverId = document.getElementById('receiverId').value;
            const content = document.getElementById('messageContent').value;
            
            if (!content) {
                alert('请输入消息内容');
                return;
            }
            
            const message = {
                receiverId: parseInt(receiverId),
                content: content,
                messageType: 'TEXT'
            };
            
            stompClient.send('/app/chat.send', {}, JSON.stringify(message));
            addMessage('我', content, 'sent');
            document.getElementById('messageContent').value = '';
        }
        
        function addMessage(sender, content, type) {
            const div = document.createElement('div');
            div.className = 'message ' + (type || '');
            div.innerHTML = '<strong>' + sender + '</strong>: ' + content + 
                '<small style="color:#999"> ' + new Date().toLocaleTimeString() + '</small>';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }
    </script>
</body>
</html>
