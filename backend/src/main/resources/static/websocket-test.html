<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
    <h1>WebSocket 身份验证测试</h1>
    
    <div>
        <label>Token: </label>
        <input type="text" id="token" size="80" placeholder="输入JWT Token">
    </div>
    
    <div>
        <button onclick="connect()">连接WebSocket</button>
        <button onclick="disconnect()">断开连接</button>
    </div>
    
    <div id="status">状态: 未连接</div>
    
    <script>
        let stompClient = null;
        
        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                alert('请输入Token');
                return;
            }
            
            const socket = new SockJS('http://localhost:8090/ws?token=' + token);
            stompClient = Stomp.over(socket);
            
            stompClient.connect({}, function(frame) {
                document.getElementById('status').innerHTML = '状态: 已连接 ✓<br>' + frame;
                console.log('Connected: ' + frame);
            }, function(error) {
                document.getElementById('status').innerHTML = '状态: 连接失败 ✗<br>' + error;
                console.log('Error: ' + error);
            });
        }
        
        function disconnect() {
            if (stompClient !== null) {
                stompClient.disconnect();
            }
            document.getElementById('status').innerHTML = '状态: 已断开';
            console.log('Disconnected');
        }
    </script>
</body>
</html>
