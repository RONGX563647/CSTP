name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "CONFIRM" to deploy'
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest

    steps:
      - name: Check CI workflow status
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });
            if (runs.data.workflow_runs.length === 0) {
              core.setFailed('No completed CI run found for main branch');
              return;
            }
            const latest = runs.data.workflow_runs[0];
            if (latest.conclusion !== 'success') {
              core.setFailed(`Latest CI run conclusion: ${latest.conclusion}`);
            }
            console.log(`Latest CI run: ${latest.html_url} - ${latest.conclusion}`);

  build-and-push:
    name: Build & Push Images
    needs: verify-ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=sha
            type=ref,event=tag
            latest

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=ref,event=tag
            latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: VITE_API_BASE_URL=${{ vars.API_BASE_URL || '/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/aisale

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Rolling restart
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check
            sleep 15
            for i in 1 2 3; do
              if curl -sf http://localhost:8090/actuator/health > /dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "Health check failed, rolling back"
                docker compose -f docker-compose.prod.yml down
                exit 1
              fi
              echo "Health check attempt $i failed, retrying..."
              sleep 10
            done

            # Clean up old images
            docker image prune -f
